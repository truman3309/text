<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>出貨日期與出貨量統計</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme:dark;

    --ink:#F5F5F7;
    --muted:rgba(245,245,247,0.60);

    --steel:#64B5FF;
    --steel-dark:#8CC8FF;
    --steel-solid:#0A84FF;
    --steel-tint:rgba(100,181,255,0.16);
    --brass:#FFB84D;
    --brass-tint:rgba(255,159,10,0.20);
    --success:#5CE07F;
    --success-tint:rgba(48,209,88,0.20);
    --danger:#FF6B61;
    --danger-tint:rgba(255,69,58,0.20);

    --bg-a:#14171E;
    --bg-b:#191C26;
    --bg-c:#1F1B26;
    --orb-1:rgba(90,110,160,0.22);
    --orb-2:rgba(70,120,150,0.18);

    --glass:        rgba(30,30,40,0.50);
    --glass-field:  rgba(255,255,255,0.07);
    --glass-field-2:rgba(255,255,255,0.12);
    --glass-border: rgba(255,255,255,0.14);
    --glass-hi:     rgba(255,255,255,0.10);
    --glass-shadow: 0 8px 32px rgba(0,0,0,0.45);
    --hairline:     rgba(255,255,255,0.10);
    --blur:         blur(24px) saturate(160%);

    --paper:#14171E;
    --card-bg:rgba(30,30,40,0.50);
    --border:rgba(255,255,255,0.14);

    --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","PingFang TC","Noto Sans TC","Helvetica Neue",sans-serif;
    --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  }

  *{box-sizing:border-box;}
  html{ background:var(--bg-b); }
  body{
    margin:0;
    background:linear-gradient(135deg, var(--bg-a) 0%, var(--bg-b) 48%, var(--bg-c) 100%) fixed;
    color:var(--ink);
    font-family:var(--font);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    padding:32px 20px 96px;
    position:relative;
    overflow-x:hidden;
  }
  body::before, body::after{
    content:''; position:fixed; border-radius:50%; filter:blur(70px);
    pointer-events:none; z-index:0;
  }
  body::before{ width:420px; height:420px; background:var(--orb-1); top:-120px; right:-100px; }
  body::after{ width:480px; height:480px; background:var(--orb-2); bottom:-160px; left:-140px; }
  .wrap{ max-width:1080px; margin:0 auto; position:relative; z-index:1; }

  /* ---------- 玻璃共用質感（只套在外層大元素）---------- */
  .panel,
  .site-nav,
  .api-status-bar{
    background:var(--glass);
    border:1px solid var(--glass-border);
    -webkit-backdrop-filter:var(--blur);
    backdrop-filter:var(--blur);
    box-shadow:var(--glass-shadow), inset 0 1px 0 var(--glass-hi);
  }

  /* ---------- 導覽列 ---------- */
  .site-nav{
    display:inline-flex; gap:2px; padding:4px; margin-bottom:36px; flex-wrap:wrap;
    border-radius:980px;
  }
  .site-nav-link{
    font-size:13px; font-weight:500; color:var(--ink); text-decoration:none;
    padding:7px 16px; border-radius:980px; border:none; margin:0;
    transition:background .2s, box-shadow .2s, color .2s;
  }
  .site-nav-link:hover{ color:var(--steel); }
  .site-nav-link.active{
    background:rgba(24,24,34,0.92); color:var(--ink);
    box-shadow:0 1px 4px rgba(0,0,0,0.4), inset 0 1px 0 var(--glass-hi);
  }

  /* ---------- 標題 ---------- */
  header{ margin-bottom:28px; }
  .eyebrow{
    font-size:13px; font-weight:600; letter-spacing:0; color:var(--steel);
    text-transform:none; display:block; margin-bottom:6px;
  }
  .eyebrow::before{ display:none; }
  h1{
    font-family:var(--font); font-weight:700; color:var(--ink);
    font-size:clamp(30px,5vw,46px); letter-spacing:-0.03em; line-height:1.08;
    margin:0 0 12px;
  }
  header p{ margin:0; color:var(--muted); font-size:15px; max-width:720px; line-height:1.7; }

  /* ---------- 狀態列 ---------- */
  .api-status-bar{
    display:inline-flex; align-items:center; gap:8px; padding:7px 14px; margin-bottom:20px;
    font-size:12.5px; color:var(--muted); border-radius:980px;
  }
  .dot{ width:8px; height:8px; border-radius:50%; background:var(--muted); flex-shrink:0; }
  .dot.ok{ background:#30D158; box-shadow:0 0 8px rgba(48,209,88,0.7); }
  .dot.bad{ background:#FF453A; box-shadow:0 0 8px rgba(255,69,58,0.7); }
  .dot.pending{ background:#FF9F0A; box-shadow:0 0 8px rgba(255,159,10,0.7); }

  /* ---------- 主卡片 ---------- */
  .panel{ border-radius:28px; overflow:hidden; margin-bottom:22px; }

  .summary-row{ display:flex; gap:40px; padding:24px 26px; border-bottom:1px solid var(--hairline); flex-wrap:wrap; }
  .summary-stat .label{ font-size:12.5px; font-weight:600; letter-spacing:0; text-transform:none; color:var(--muted); margin-bottom:6px; }
  .summary-stat .value{
    font-size:30px; font-weight:700; letter-spacing:-0.02em; color:var(--ink);
    font-variant-numeric:tabular-nums;
  }
  .summary-stat .value span{ font-size:14px; color:var(--muted); font-weight:500; letter-spacing:0; }

  .toolbar{ display:flex; justify-content:space-between; align-items:center; padding:16px 26px; gap:10px; flex-wrap:wrap; border-bottom:1px solid var(--hairline); }
  .search-box{
    flex:1; min-width:180px; padding:9px 16px; font-size:14px;
    font-family:var(--font); color:var(--ink);
    background:var(--glass-field); border:1px solid var(--glass-border); border-radius:980px; outline:none;
    transition:border-color .15s, box-shadow .15s, background .15s;
  }
  .search-box::placeholder{ color:var(--muted); }
  .search-box:focus{ border-color:var(--steel); box-shadow:0 0 0 4px var(--steel-tint); background:var(--glass-field-2); }

  .refresh-btn, .export-btn, .expand-all-btn{
    font-family:var(--font); font-weight:500; font-size:14px;
    border:1px solid var(--glass-border); background:var(--glass-field); color:var(--steel);
    padding:9px 18px; border-radius:980px; cursor:pointer; white-space:nowrap;
    transition:background .15s, color .15s, transform .1s;
  }
  .refresh-btn:hover, .export-btn:hover, .expand-all-btn:hover{ background:var(--steel-solid); color:#fff; border-color:transparent; }
  .refresh-btn:active, .export-btn:active, .expand-all-btn:active{ transform:scale(0.97); }

  /* ---------- 年月清單 ---------- */
  .col-labels{
    display:grid; grid-template-columns:120px 1fr 120px 28px; gap:10px; padding:11px 26px;
    font-size:12px; font-weight:600; letter-spacing:0; text-transform:none;
    color:var(--muted); border-bottom:1px solid var(--hairline); background:rgba(255,255,255,0.04);
  }
  .col-labels span:nth-child(3){ text-align:right; }

  .model-row-header{
    display:grid; grid-template-columns:120px 1fr 120px 28px; gap:10px; align-items:center;
    padding:14px 26px; cursor:pointer; user-select:none;
    border-bottom:1px solid var(--hairline); transition:background .12s;
    font-size:14px;
  }
  .model-row-header:hover{ background:rgba(255,255,255,0.05); }
  .model-row-header.expanded{ background:var(--steel-tint); }
  .model-row-header.new-month{ border-top:1px solid rgba(100,181,255,0.40); }
  .m-ym{ color:var(--steel); font-weight:700; font-family:var(--mono); font-size:13.5px; }
  .m-name{ line-height:1.55; color:var(--ink); }
  .m-qty{ font-weight:700; text-align:right; color:var(--brass); white-space:nowrap; font-variant-numeric:tabular-nums; }
  .caret{
    width:16px; height:16px; flex-shrink:0; display:flex; align-items:center; justify-content:center;
    font-size:11px; color:var(--muted); transition:transform .18s ease; transform:rotate(0deg); justify-self:end;
  }
  .model-row-header.expanded .caret{ transform:rotate(90deg); color:var(--steel); }

  /* ---------- 展開明細（墊較深的一層，檔名與數字才好讀）---------- */
  .detail-wrap{ padding:6px 26px 18px 44px; background:rgba(10,11,18,0.38); border-bottom:1px solid var(--hairline); }
  table{ border-collapse:collapse; width:100%; font-size:13px; }
  thead th{
    text-align:left; padding:10px 12px; font-size:12px; font-weight:600;
    letter-spacing:0; text-transform:none; color:var(--muted);
    border-bottom:1px solid var(--hairline); white-space:nowrap;
  }
  tbody td{
    padding:10px 12px; border-bottom:1px solid var(--hairline); white-space:nowrap;
    font-family:var(--mono); font-variant-numeric:tabular-nums;
  }
  tbody tr{ transition:background .12s; }
  tbody tr:hover{ background:var(--steel-tint); }
  tbody tr:last-child td{ border-bottom:none; }
  td.qty{ font-weight:700; text-align:right; color:var(--brass); }
  td.filename{ font-family:var(--mono); font-size:12px; color:var(--steel); white-space:normal; word-break:break-all; max-width:380px; }
  .unparsed-badge{
    display:inline-block; font-family:var(--font); font-size:10.5px; font-weight:500;
    background:var(--danger-tint); color:var(--danger); padding:2px 9px; border-radius:980px; margin-left:8px;
  }

  .section-title{
    font-size:13px; letter-spacing:0; text-transform:none;
    color:var(--steel); font-weight:600; padding:22px 26px 4px;
  }
  .section-hint{ font-size:12.5px; color:var(--muted); padding:0 26px 14px; line-height:1.7; }

  .table-scroll{ overflow-x:auto; }

  .empty-state, .loading-state{ padding:64px 20px; text-align:center; color:var(--muted); font-size:14px; }
  .loading-state .big, .empty-state .big{ font-size:18px; font-weight:600; color:var(--ink); margin-bottom:8px; }
  .error-msg{ color:var(--danger); font-size:13.5px; padding:16px 26px; white-space:pre-line; line-height:1.6; }

  /* ---------- 捲軸 ---------- */
  ::-webkit-scrollbar{ width:10px; height:10px; }
  ::-webkit-scrollbar-thumb{
    background:rgba(235,235,245,0.26); border-radius:980px;
    border:2px solid transparent; background-clip:content-box;
  }
  ::-webkit-scrollbar-thumb:hover{ background:rgba(235,235,245,0.40); background-clip:content-box; border:2px solid transparent; }
  ::-webkit-scrollbar-track{ background:transparent; }
  ::selection{ background:rgba(100,181,255,0.40); color:#fff; }

  /* ---------- 不支援 backdrop-filter 的瀏覽器 ---------- */
  @supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
    :root{ --glass:rgba(30,31,42,0.94); }
  }

  /* ---------- 減少動態效果 ---------- */
  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; animation:none !important; }
  }

  /* ---------- 響應式 ---------- */
  @media (max-width:640px){
    body{ padding:20px 14px 64px; }
    .panel{ border-radius:22px; }
    .summary-row{ gap:24px; padding:20px 18px; }
    .toolbar{ padding:14px 18px; }
    .model-row-header, .col-labels{ grid-template-columns:84px 1fr 84px 22px; padding-left:18px; padding-right:18px; font-size:12.5px; }
    .detail-wrap{ padding:6px 14px 16px 18px; }
    .section-title, .section-hint{ padding-left:18px; padding-right:18px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <nav class="site-nav">
    <a class="site-nav-link" href="index.html">欄位重複比對台</a>
    <a class="site-nav-link" href="stats-by-model.html">機種出貨量統計</a>
    <a class="site-nav-link active" href="stats-by-date.html">出貨日期與出貨量統計</a>
    <a class="site-nav-link" href="search.html">資料庫搜尋</a>
  </nav>

  <header>
    <div class="eyebrow">Shipment Stats — By Date</div>
    <h1>出貨日期與出貨量統計</h1>
    <p>依檔案名稱解析出貨日期（例如 "Aug 14 2026" 或 "260304" 這類格式）與出貨數量（檔名裡的 "XXXPCS"）。同一個年月只會出現一行，機種欄位會把該月所有機種名稱合併顯示，數量為該月總和；點擊可展開看到該月所有檔案的日期、檔名、機種與數量，預設全部收合。無法從檔名判讀日期的部分列在下方單獨區塊。</p>
  </header>

  <div class="api-status-bar" id="apiStatusBar">
    <span class="dot" id="apiStatusDot"></span>
    <span id="apiStatusText">資料庫連線設定</span>
  </div>

  <div class="panel">
    <div class="summary-row" id="summaryRow" style="display:none;">
      <div class="summary-stat">
        <div class="label">檔案數</div>
        <div class="value" id="statFileCount">0</div>
      </div>
      <div class="summary-stat">
        <div class="label">總出貨量</div>
        <div class="value" id="statTotalQty">0 <span>台</span></div>
      </div>
      <div class="summary-stat">
        <div class="label">日期可判讀</div>
        <div class="value" id="statParsedCount">0</div>
      </div>
    </div>

    <div class="toolbar">
      <input class="search-box" id="searchBox" placeholder="搜尋檔名或機種…">
      <button class="expand-all-btn" id="expandAllBtn">全部展開</button>
      <button class="refresh-btn" id="refreshBtn">重新整理</button>
      <button class="export-btn" id="exportBtn">匯出 CSV</button>
    </div>

    <div id="content">
      <div class="loading-state" id="loadingState">
        <div class="big">正在讀取資料…</div>
      </div>
    </div>
    <div class="error-msg" id="errorMsg" style="display:none;"></div>
  </div>

</div>

<script>
  function escapeHtml(str){
    return String(str ?? '').replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
  }

  let SUPABASE_URL = null;
  let SUPABASE_ANON_KEY = null;
  let configPromise = null;

  function ensureConfig(){
    if(SUPABASE_URL && SUPABASE_ANON_KEY) return Promise.resolve();
    if(!configPromise){
      configPromise = fetch('/api/config')
        .then(res => {
          if(!res.ok) throw new Error('無法取得資料庫連線設定（HTTP ' + res.status + '）');
          return res.json();
        })
        .then(cfg => {
          if(!cfg.supabaseUrl || !cfg.supabaseAnonKey){
            throw new Error('資料庫連線設定不完整');
          }
          SUPABASE_URL = cfg.supabaseUrl;
          SUPABASE_ANON_KEY = cfg.supabaseAnonKey;
        })
        .catch(err => { configPromise = null; throw err; });
    }
    return configPromise;
  }
  function supabaseHeaders(extra){
    return Object.assign({
      'apikey': SUPABASE_ANON_KEY,
      'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
      'Content-Type': 'application/json',
    }, extra || {});
  }

  const apiStatusDot = document.getElementById('apiStatusDot');
  const apiStatusText = document.getElementById('apiStatusText');
  function setStatusBar(state, text){
    apiStatusDot.className = 'dot' + (state ? ' ' + state : '');
    apiStatusText.textContent = text;
  }

  async function fetchAllShipmentFiles(){
    await ensureConfig();
    const PAGE_SIZE = 1000;
    let all = [];
    let offset = 0;
    while(true){
      const res = await fetch(
        `${SUPABASE_URL}/rest/v1/shipment_files?select=source_file_name,model,row_count,uploaded_at&order=uploaded_at.asc&limit=${PAGE_SIZE}&offset=${offset}`,
        { headers: supabaseHeaders() }
      );
      if(!res.ok){
        const errData = await res.json().catch(() => ({}));
        throw new Error(errData.message || res.statusText);
      }
      const data = await res.json();
      all = all.concat(data);
      if(data.length < PAGE_SIZE) break;
      offset += PAGE_SIZE;
    }
    return all;
  }

  const MONTH_NAMES = { jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11 };
  const THIS_YEAR = new Date().getFullYear();

  function parseShipmentInfoFromFilename(filename){
    let date = null;

    const monthMatch = filename.match(/([A-Za-z]{3,9})\.?\s+(\d{1,2}),?\s+(\d{4})/);
    if(monthMatch){
      const mKey = monthMatch[1].slice(0, 3).toLowerCase();
      if(MONTH_NAMES[mKey] !== undefined){
        const y = Number(monthMatch[3]), d = Number(monthMatch[2]);
        const dt = new Date(y, MONTH_NAMES[mKey], d);
        if(!isNaN(dt.getTime()) && dt.getFullYear() === y) date = dt;
      }
    }

    if(!date){
      const ymdMatch = filename.match(/(?<!\d)(\d{2})(\d{2})(\d{2})(?!\d)/);
      if(ymdMatch){
        const yy = Number(ymdMatch[1]), mm = Number(ymdMatch[2]), dd = Number(ymdMatch[3]);
        const fullYear = 2000 + yy;
        if(mm >= 1 && mm <= 12 && dd >= 1 && dd <= 31 && Math.abs(fullYear - THIS_YEAR) <= 5){
          const dt = new Date(fullYear, mm - 1, dd);
          if(!isNaN(dt.getTime())) date = dt;
        }
      }
    }

    let quantity = null;
    const pcsMatch = filename.match(/(\d+)\s*PCS/i);
    if(pcsMatch) quantity = parseInt(pcsMatch[1], 10);

    return { date, quantity };
  }

  function formatDate(d){
    if(!d) return null;
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${day}`;
  }

  let fullRows = []; // 已解析出日期的明細（每筆一個檔案）
  let unparsedRows = []; // 解析不出日期的

  const expandedModels = new Set(); // key: "y-m"（同月份合併成一個 key）

  // 依「年-月」分組；同月份底下所有機種名稱合併顯示在同一行，
  // 但仍保留各機種、各檔案的明細供展開使用
  function buildFlatGroups(rows){
    const ymMap = new Map(); // "y-m" -> { year, month, modelMap: Map(model -> {files, total}), total }
    rows.forEach(r => {
      const y = r.date.getFullYear();
      const m = r.date.getMonth() + 1;
      const ymKey = `${y}-${m}`;
      if(!ymMap.has(ymKey)) ymMap.set(ymKey, { year: y, month: m, modelMap: new Map(), total: 0 });
      const g = ymMap.get(ymKey);
      const modelKey = (r.model || '').trim() || '未標示機種';
      if(!g.modelMap.has(modelKey)) g.modelMap.set(modelKey, { files: [], total: 0 });
      const modelEntry = g.modelMap.get(modelKey);
      modelEntry.files.push(r);
      modelEntry.total += r.quantity;
      g.total += r.quantity;
    });

    const groups = Array.from(ymMap.values()).map(g => {
      const models = Array.from(g.modelMap.entries())
        .map(([model, v]) => ({ model, files: v.files.sort((a, b) => b.date - a.date), total: v.total }))
        .sort((a, b) => b.total - a.total);
      return { year: g.year, month: g.month, models, total: g.total };
    });

    groups.sort((a, b) => b.year - a.year || b.month - a.month);
    return groups;
  }

  function renderFlatGroups(groups){
    if(!groups.length) return '<div class="empty-state"><div class="big">沒有可判讀日期的資料</div></div>';

    let prevYm = null;
    const rows = groups.map(g => {
      const key = `${g.year}-${g.month}`;
      const expanded = expandedModels.has(key);
      const ymText = `${g.year} / ${String(g.month).padStart(2,'0')}`;
      const isNewYm = key !== prevYm;
      prevYm = key;

      // 同月份所有機種名稱合併成一行文字，例如 "H500(Verizon)、H700(AT&T)、H500(Bell)"
      const modelNamesJoined = g.models.map(m => escapeHtml(m.model)).join('、');

      const detail = expanded ? `
        <div class="detail-wrap">
          <div class="table-scroll">
            <table>
              <thead><tr><th>日期</th><th>檔名</th><th>機種</th><th style="text-align:right;">數量</th></tr></thead>
              <tbody>
                ${g.models.flatMap(m => m.files).sort((a, b) => b.date - a.date).map(f => `
                  <tr>
                    <td>${escapeHtml(f.dateStr)}</td>
                    <td class="filename">${escapeHtml(f.source_file_name)}</td>
                    <td>${escapeHtml(f.model || '—')}</td>
                    <td class="qty">${f.quantity.toLocaleString()}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </div>` : '';

      return `
        <div class="model-row-header${expanded ? ' expanded' : ''}${isNewYm ? ' new-month' : ''}" data-toggle-model="${escapeHtml(key)}">
          <span class="m-ym">${ymText}</span>
          <span class="m-name">${modelNamesJoined}</span>
          <span class="m-qty">${g.total.toLocaleString()} 台</span>
          <span class="caret">▸</span>
        </div>
        ${detail}`;
    }).join('');

    return `
      <div class="col-labels">
        <span>年月</span><span>機種</span><span>數量</span><span></span>
      </div>
      ${rows}`;
  }

  function currentFilteredRows(searchQ){
    if(!searchQ) return fullRows;
    const q = searchQ.toLowerCase();
    return fullRows.filter(r =>
      (r.source_file_name || '').toLowerCase().includes(q) || (r.model || '').toLowerCase().includes(q)
    );
  }

  function renderTables(){
    const content = document.getElementById('content');
    const searchQ = document.getElementById('searchBox').value.trim();
    const filtered = currentFilteredRows(searchQ);

    if(searchQ){
      buildFlatGroups(filtered).forEach(g => expandedModels.add(`${g.year}-${g.month}`));
    }

    const groups = buildFlatGroups(filtered);
    let html = renderFlatGroups(groups);

    const uq = searchQ.toLowerCase();
    const unparsedFiltered = searchQ
      ? unparsedRows.filter(r => (r.source_file_name || '').toLowerCase().includes(uq) || (r.model || '').toLowerCase().includes(uq))
      : unparsedRows;

    if(unparsedFiltered.length){
      html += `
        <div class="section-title">無法從檔名判讀日期（${unparsedFiltered.length} 筆）</div>
        <div class="section-hint">數量改用資料庫實際列數，僅供參考；如果需要精準統計，建議調整這些檔案的命名格式。</div>
        <div class="table-scroll">
          <table>
            <thead><tr><th>檔名</th><th>機種</th><th>上傳時間</th><th style="text-align:right;">數量（資料庫列數）</th></tr></thead>
            <tbody>${unparsedFiltered.map(r => `
              <tr>
                <td class="filename">${escapeHtml(r.source_file_name)}<span class="unparsed-badge">無法解析日期</span></td>
                <td>${escapeHtml(r.model || '—')}</td>
                <td>${escapeHtml(new Date(r.uploaded_at).toLocaleString())}</td>
                <td class="qty">${r.row_count.toLocaleString()}</td>
              </tr>
            `).join('')}</tbody>
          </table>
        </div>`;
    }

    content.innerHTML = html;
    bindTreeEvents();
  }

  function bindTreeEvents(){
    document.querySelectorAll('[data-toggle-model]').forEach(el => {
      el.addEventListener('click', () => {
        const key = el.getAttribute('data-toggle-model');
        if(expandedModels.has(key)) expandedModels.delete(key);
        else expandedModels.add(key);
        renderTables();
      });
    });
  }

  async function loadData(){
    const errorMsg = document.getElementById('errorMsg');
    const content = document.getElementById('content');
    errorMsg.style.display = 'none';
    document.getElementById('summaryRow').style.display = 'none';
    content.innerHTML = '<div class="loading-state"><div class="big">正在讀取資料…</div></div>';
    setStatusBar('pending', '資料庫連線：讀取中…');

    try{
      const files = await fetchAllShipmentFiles();
      setStatusBar('ok', '資料庫連線成功');

      fullRows = [];
      unparsedRows = [];
      expandedModels.clear();

      files.forEach(f => {
        const info = parseShipmentInfoFromFilename(f.source_file_name || '');
        if(info.date){
          fullRows.push({
            source_file_name: f.source_file_name, model: f.model,
            date: info.date, dateStr: formatDate(info.date),
            quantity: info.quantity != null ? info.quantity : f.row_count,
          });
        } else {
          unparsedRows.push(f);
        }
      });

      fullRows.sort((a, b) => b.date - a.date);

      const totalQty = fullRows.reduce((s, r) => s + r.quantity, 0) + unparsedRows.reduce((s, r) => s + r.row_count, 0);
      document.getElementById('summaryRow').style.display = 'flex';
      document.getElementById('statFileCount').textContent = files.length;
      document.getElementById('statTotalQty').innerHTML = totalQty.toLocaleString() + ' <span>台</span>';
      document.getElementById('statParsedCount').textContent = `${fullRows.length} / ${files.length}`;

      renderTables();
    } catch(err){
      setStatusBar('bad', '資料庫連線失敗：' + err.message);
      content.innerHTML = '';
      errorMsg.style.display = 'block';
      errorMsg.textContent = '讀取失敗：' + err.message;
    }
  }

  let searchDebounceTimer = null;
  document.getElementById('searchBox').addEventListener('input', () => {
    clearTimeout(searchDebounceTimer);
    searchDebounceTimer = setTimeout(renderTables, 150);
  });

  document.getElementById('refreshBtn').addEventListener('click', loadData);

  let allExpanded = false;
  document.getElementById('expandAllBtn').addEventListener('click', () => {
    allExpanded = !allExpanded;
    document.getElementById('expandAllBtn').textContent = allExpanded ? '全部收合' : '全部展開';
    if(allExpanded){
      buildFlatGroups(currentFilteredRows(document.getElementById('searchBox').value.trim()))
        .forEach(g => expandedModels.add(`${g.year}-${g.month}`));
    } else {
      expandedModels.clear();
    }
    renderTables();
  });

  document.getElementById('exportBtn').addEventListener('click', () => {
    const searchQ = document.getElementById('searchBox').value.trim();
    const filtered = currentFilteredRows(searchQ);
    if(!filtered.length && !unparsedRows.length) return;
    const lines = ['"出貨日期","檔名","機種","數量"'];
    filtered.forEach(r => {
      lines.push(`"${r.dateStr}","${String(r.source_file_name).replace(/"/g,'""')}","${String(r.model || '').replace(/"/g,'""')}","${r.quantity}"`);
    });
    const csv = '\uFEFF' + lines.join('\n');
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = '出貨日期與出貨量統計.csv';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });

  loadData();
</script>
</body>
</html>
