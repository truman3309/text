<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>欄位重複比對台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --paper:#F3F5F4;
    --paper-line: rgba(43,88,118,0.09);
    --ink:#1B232B;
    --steel:#2B5876;
    --steel-dark:#1F425B;
    --steel-tint: rgba(43,88,118,0.07);
    --brass:#B8862E;
    --brass-tint: rgba(184,134,46,0.12);
    --muted:#6B7780;
    --success:#3F7A5C;
    --success-tint: rgba(63,122,92,0.10);
    --danger:#A8482F;
    --border:#D7DDE0;
    --card-bg:#FFFFFF;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background-color:var(--paper);
    background-image:
      repeating-linear-gradient(to right, var(--paper-line) 0 1px, transparent 1px 28px),
      repeating-linear-gradient(to bottom, var(--paper-line) 0 1px, transparent 1px 28px);
    color:var(--ink);
    font-family:'IBM Plex Sans', system-ui, sans-serif;
    min-height:100vh;
    padding:40px 20px 80px;
  }
  .wrap{ max-width:1080px; margin:0 auto; }

  header{ margin-bottom:30px; }
  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px; letter-spacing:0.22em; font-weight:600;
    color:var(--steel); text-transform:uppercase;
    display:flex; align-items:center; gap:10px; margin-bottom:10px;
  }
  .eyebrow::before{ content:''; width:22px; height:1px; background:var(--steel); display:inline-block; }
  h1{
    font-family:'IBM Plex Mono', monospace;
    font-weight:700; font-size:clamp(28px,4vw,40px);
    margin:0 0 8px; letter-spacing:-0.01em;
  }
  header p{ margin:0; color:var(--muted); font-size:14.5px; max-width:600px; line-height:1.6; }

  .panel{
    background:var(--card-bg);
    border:1px solid var(--border);
    border-radius:2px;
    box-shadow:0 1px 0 rgba(27,35,43,0.03);
  }

  .layout{ display:flex; gap:20px; align-items:flex-start; }
  .main-panel{ flex:1 1 640px; min-width:0; }
  .files-panel{ flex:0 0 280px; min-width:240px; padding:18px; }
  .files-panel-header{ margin-bottom:12px; }
  .files-empty{ font-size:13px; color:var(--muted); padding:18px 4px; text-align:center; }
  .files-list{ display:flex; flex-direction:column; gap:8px; max-height:560px; overflow-y:auto; }
  .file-group-label{
    font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:.08em; text-transform:uppercase;
    color:var(--steel); font-weight:600; margin:10px 0 2px; padding-bottom:5px; border-bottom:1px solid var(--border);
    display:flex; justify-content:space-between; align-items:center;
  }
  .file-group-label:first-child{ margin-top:0; }
  .file-group-count{
    font-weight:500; color:var(--muted); background:var(--steel-tint); border-radius:2px;
    padding:1px 6px; font-size:10px;
  }
  .file-item{
    border:1px solid var(--border); border-left:3px solid var(--border); border-radius:2px;
    padding:9px 10px; display:flex; justify-content:space-between; align-items:center; gap:8px;
    cursor:pointer;
  }
  .file-item:hover{ border-top-color:var(--steel); border-right-color:var(--steel); border-bottom-color:var(--steel); }
  .file-item.active{ border-left-color:var(--success); background:var(--success-tint); }
  .file-item-main{ flex:1; min-width:0; }
  .file-item-name{ font-family:'IBM Plex Mono',monospace; font-size:12px; font-weight:600; word-break:break-all; line-height:1.3; }
  .file-item-meta{ font-size:11px; color:var(--muted); margin-top:3px; }
  .file-item-actions{ display:flex; flex-direction:column; gap:4px; flex-shrink:0; }
  .file-remove-btn{
    font-family:'IBM Plex Mono',monospace; font-size:10.5px; border:1px solid var(--border);
    background:#fff; border-radius:2px; padding:3px 7px; cursor:pointer; color:var(--muted); white-space:nowrap;
  }
  .file-remove-btn:hover{ border-color:var(--danger); color:var(--danger); }

  .upload-single{ padding:22px 22px 0; }

  .slot{
    position:relative; padding:26px 22px; border:1px dashed var(--border);
    border-radius:2px; background:var(--card-bg); transition:border-color .15s, background .15s;
    cursor:pointer; min-height:150px; display:flex; flex-direction:column; justify-content:center;
  }
  .slot.drag{ border-color:var(--steel); background:var(--steel-tint); }
  .slot.loaded{ border-style:solid; border-color:var(--success); background:var(--success-tint); cursor:default; }
  .slot input{ display:none; }
  .corner{ position:absolute; width:14px; height:14px; border-color:var(--steel); opacity:.55; }
  .corner.tl{ top:-1px; left:-1px; border-top:2px solid; border-left:2px solid; }
  .corner.tr{ top:-1px; right:-1px; border-top:2px solid; border-right:2px solid; }
  .corner.bl{ bottom:-1px; left:-1px; border-bottom:2px solid; border-left:2px solid; }
  .corner.br{ bottom:-1px; right:-1px; border-bottom:2px solid; border-right:2px solid; }
  .slot.loaded .corner{ border-color:var(--success); }

  .slot-label{
    font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:.14em;
    color:var(--steel); font-weight:600; text-transform:uppercase; margin-bottom:10px;
  }
  .slot-main{ font-size:14.5px; color:var(--ink); }
  .slot-hint{ font-size:12.5px; color:var(--muted); margin-top:4px; }
  .slot-file{ font-family:'IBM Plex Mono', monospace; font-size:13.5px; font-weight:600; word-break:break-all; }
  .slot-meta{ font-size:12.5px; color:var(--muted); margin-top:4px; }
  .slot-clear{
    position:absolute; top:10px; right:10px; font-family:'IBM Plex Mono',monospace;
    font-size:11px; color:var(--muted); background:none; border:1px solid var(--border);
    border-radius:2px; padding:3px 7px; cursor:pointer;
  }
  .slot-clear:hover{ color:var(--danger); border-color:var(--danger); }

  .config{ padding:22px; border-top:1px solid var(--border); margin-top:22px; }
  .config-grid{ display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-bottom:18px; align-items:start; }
  .field-label{
    font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:.1em;
    color:var(--steel); text-transform:uppercase; font-weight:600; display:block; margin-bottom:7px;
  }
  select{
    width:100%; padding:9px 10px; border:1px solid var(--border); border-radius:2px;
    font-family:'IBM Plex Sans', sans-serif; font-size:14px; background:var(--card-bg); color:var(--ink);
  }
  select:disabled{ color:var(--muted); background:#FAFAFA; }

  .count-row{ display:flex; align-items:center; gap:10px; margin-bottom:16px; }
  .count-row .field-label{ margin-bottom:0; }
  .count-input{
    width:64px; padding:7px 8px; border:1px solid var(--border); border-radius:2px;
    font-family:'IBM Plex Mono',monospace; font-size:14px; text-align:center; color:var(--ink);
  }

  .fields-row{ display:flex; flex-wrap:wrap; gap:10px; align-items:start; margin-bottom:20px; }
  .field-chip{ flex:1 1 150px; min-width:150px; }
  .field-chip .chip-label{
    font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.08em;
    text-transform:uppercase; margin-bottom:5px; display:block; color:var(--muted);
  }
  .field-chip.key-chip{ position:relative; }
  .field-chip.key-chip .chip-label{ color:var(--steel); }
  .field-chip.key-chip select{ border-color:var(--steel); }
  #compareFieldsList{ display:contents; }
  .compare-field-row{ flex:1 1 150px; min-width:150px; }
  .compare-field-row .chip-label{
    font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.08em;
    text-transform:uppercase; margin-bottom:5px; display:block; color:var(--brass);
  }
  .compare-field-row select{ margin:0; border-color:var(--brass); }

  .toggles{ display:flex; gap:20px; flex-wrap:wrap; margin-bottom:20px; }
  .toggle{ display:flex; align-items:center; gap:7px; font-size:13.5px; color:var(--ink); cursor:pointer; }
  .toggle input{ accent-color:var(--steel); width:15px; height:15px; }

  .mode-select{ margin-bottom:20px; }
  .mode-options{ display:flex; flex-direction:column; gap:9px; margin-top:4px; }

  .run-btn{
    font-family:'IBM Plex Mono', monospace; font-weight:600; font-size:14px; letter-spacing:.04em;
    background:var(--steel); color:#fff; border:none; padding:12px 26px; border-radius:2px;
    cursor:pointer; display:inline-flex; align-items:center; gap:8px; transition:background .15s;
  }
  .run-btn:hover:not(:disabled){ background:var(--steel-dark); }
  .run-btn:disabled{ background:#C6CDD1; cursor:not-allowed; }
  .error-msg{ color:var(--danger); font-size:13px; margin-top:12px; font-family:'IBM Plex Mono',monospace; }

  .results{ margin-top:34px; display:none; }
  .results.show{ display:block; }
  .gauge{ padding:20px 22px; border-bottom:1px solid var(--border); }
  .gauge-top{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px; flex-wrap:wrap; gap:8px; }
  .gauge-title{ font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.14em; color:var(--muted); text-transform:uppercase; }
  .gauge-count{ font-family:'IBM Plex Mono',monospace; font-size:22px; font-weight:700; color:var(--success); }
  .gauge-count span{ font-size:13px; color:var(--muted); font-weight:500; }
  .gauge-track{
    position:relative; height:10px; border-radius:1px; background:#EDEFF0; overflow:hidden;
    background-image:repeating-linear-gradient(to right, rgba(107,119,128,0.18) 0 1px, transparent 1px 20px);
  }
  .gauge-fill{ position:absolute; inset:0; width:0%; background:var(--success); transition:width .5s ease; }
  .stat-row{ display:flex; gap:24px; margin-top:12px; flex-wrap:wrap; }
  .stat{ font-size:12.5px; color:var(--muted); font-family:'IBM Plex Mono',monospace; }
  .stat b{ color:var(--ink); font-size:14px; }

  .toolbar{ display:flex; justify-content:space-between; align-items:center; padding:16px 22px; gap:12px; flex-wrap:wrap; }
  .search-box{
    flex:1; min-width:180px; padding:8px 11px; border:1px solid var(--border); border-radius:2px;
    font-size:13.5px; font-family:'IBM Plex Sans',sans-serif;
  }
  .export-btn{
    font-family:'IBM Plex Mono',monospace; font-size:12.5px; font-weight:600; letter-spacing:.03em;
    background:none; border:1px solid var(--steel); color:var(--steel); padding:8px 16px;
    border-radius:2px; cursor:pointer; white-space:nowrap;
  }
  .export-btn:hover{ background:var(--steel); color:#fff; }

  .table-scroll{ overflow-x:auto; border-top:1px solid var(--border); }
  table{ border-collapse:collapse; width:100%; font-size:13px; }
  thead th{
    position:sticky; top:0; background:#FAFBFB; text-align:left; padding:9px 14px;
    font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:.06em; text-transform:uppercase;
    color:var(--muted); border-bottom:1px solid var(--border); white-space:nowrap;
  }
  tbody td{ padding:9px 14px; border-bottom:1px solid #EEF0F1; white-space:nowrap; }
  tbody tr:hover{ background:#FAFBFB; }
  tbody tr.group-alt td{ background:#F7F8F6; }
  tbody tr.group-alt:hover td{ background:#F1F3F2; }
  td.idx{ font-family:'IBM Plex Mono',monospace; color:var(--muted); font-size:12px; }
  td.hitfield{ font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:12px; }
  td.hitfield.mode-horizontal{ color:var(--brass); }
  td.hitfield.mode-vertical{ color:#D2691E; }
  td.key{ font-family:'IBM Plex Mono',monospace; font-weight:600; background:var(--brass-tint); }
  td.keycol{ font-family:'IBM Plex Mono',monospace; font-weight:600; color:var(--steel); background:var(--steel-tint); }
  th.key{ color:var(--brass); }
  th.keycol{ color:var(--steel); }
  th.cmp{ color:var(--brass); opacity:.7; }

  .empty-state{ padding:50px 20px; text-align:center; color:var(--muted); font-size:14px; }
  .empty-state .big{ font-family:'IBM Plex Mono',monospace; font-size:15px; color:var(--ink); margin-bottom:6px; }

  @media (max-width:900px){
    .layout{ flex-direction:column; }
    .files-panel{ flex:1 1 auto; width:100%; }
  }
  @media (max-width:640px){
    .config-grid{ grid-template-columns:1fr; }
    .gauge-top{ flex-direction:column; align-items:flex-start; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="eyebrow">Duplicate Finder</div>
    <h1>欄位重複比對台</h1>
    <p>上傳一份 Excel 或 CSV，指定要檢查重複的欄位（可多選）與識別用的 Key 欄位，找出檔案內重複的項目。所有處理都在瀏覽器內完成，檔案不會被上傳到任何伺服器。</p>
  </header>

  <div class="layout">
  <div class="panel main-panel">
    <div class="upload-single">
      <div class="slot" id="slotS" tabindex="0">
        <span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
        <button class="slot-clear" id="clearS" style="display:none;">清除</button>
        <input type="file" id="fileS" multiple>
        <div class="slot-label">上傳檔案</div>
        <div class="slot-body" id="slotSBody">
          <div class="slot-main">點擊或拖曳檔案到此處（可一次選多個）</div>
          <div class="slot-hint">支援 .xlsx / .xls / .csv</div>
        </div>
      </div>
    </div>

    <div class="config">
      <div class="count-row">
        <label class="field-label">比對欄位數量</label>
        <input type="number" class="count-input" id="compareCount" min="1" max="8" value="1">
      </div>

      <div class="fields-row" id="fieldsRow">
        <div class="field-chip key-chip">
          <span class="chip-label">Key 欄位</span>
          <select id="colKey" disabled><option>先上傳檔案</option></select>
        </div>
        <div id="compareFieldsList"></div>
      </div>

      <div class="mode-select">
        <label class="field-label">比對方向</label>
        <div class="mode-options">
          <label class="toggle"><input type="radio" name="compareMode" value="horizontal"> 橫排比對（同一列中，欄位彼此是否相同，例：12345）</label>
          <label class="toggle"><input type="radio" name="compareMode" value="vertical" checked> 直排比對（同一欄位，往下比對不同列是否相同，例：1／2／3／4／5）</label>
          <label class="toggle"><input type="radio" name="compareMode" value="both"> 兩者都要</label>
        </div>
      </div>

      <div class="toggles">
        <label class="toggle"><input type="checkbox" id="ignoreCaseS" checked> 忽略大小寫</label>
        <label class="toggle"><input type="checkbox" id="ignoreSpaceS" checked> 忽略前後空白</label>
      </div>

      <button class="run-btn" id="runBtnS" disabled>▶ 找出重複項目</button>
      <div class="error-msg" id="errorMsgS"></div>
    </div>
  </div>

  <div class="panel files-panel">
    <div class="files-panel-header">
      <span class="field-label">已上傳檔案</span>
    </div>
    <div class="files-list" id="filesList">
      <div class="files-empty" id="filesEmpty">尚未上傳任何檔案</div>
    </div>
  </div>
  </div>

  <div class="results" id="results">
    <div class="panel">
      <div class="gauge">
        <div class="gauge-top">
          <div class="gauge-title" id="gaugeTitle">Duplicate Result</div>
          <div class="gauge-count" id="gaugeCount">0 <span>筆重複列</span></div>
        </div>
        <div class="gauge-track"><div class="gauge-fill" id="gaugeFill"></div></div>
        <div class="stat-row" id="statRow"></div>
      </div>

      <div class="toolbar">
        <input class="search-box" id="searchBox" placeholder="在結果中搜尋…">
        <button class="export-btn" id="exportBtn">匯出 CSV</button>
      </div>

      <div class="table-scroll">
        <table id="resultTable">
          <thead><tr id="tableHead"></tr></thead>
          <tbody id="tableBody"></tbody>
        </table>
        <div class="empty-state" id="emptyState" style="display:none;">
          <div class="big" id="emptyBig">沒有找到重複的項目</div>
          <div id="emptyDesc">確認選擇的比對欄位正確，或嘗試切換「忽略大小寫／空白」選項。</div>
        </div>
      </div>
    </div>
  </div>

</div>

<script>
  const single = { file:null };

  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
  }

  function readWorkbook(file){
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = (e) => {
        try{
          const data = new Uint8Array(e.target.result);
          const wb = XLSX.read(data, { type:'array' });
          const sheet = wb.Sheets[wb.SheetNames[0]];
          const rows = XLSX.utils.sheet_to_json(sheet, { defval:'' });
          if(!rows.length) return reject(new Error('檔案內沒有可讀取的資料列'));
          resolve({ rows, columns: Object.keys(rows[0]) });
        } catch(err){ reject(new Error('無法解析檔案，請確認格式為 .xlsx / .xls / .csv')); }
      };
      reader.onerror = () => reject(new Error('讀取檔案時發生錯誤'));
      reader.readAsArrayBuffer(file);
    });
  }

  // ---------- compare-field rows (dynamic count) ----------
  const compareFieldsList = document.getElementById('compareFieldsList');
  const compareCountInput = document.getElementById('compareCount');

  function makeCompareRow(index){
    const row = document.createElement('div');
    row.className = 'compare-field-row';
    const label = document.createElement('span');
    label.className = 'chip-label';
    label.textContent = '比對欄位 ' + (index + 1);
    row.appendChild(label);
    const sel = document.createElement('select');
    sel.className = 'compare-field-select';
    if(single.file){
      sel.innerHTML = single.file.columns.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('');
    } else {
      sel.disabled = true;
      sel.innerHTML = '<option>先上傳檔案</option>';
    }
    row.appendChild(sel);
    return row;
  }

  function syncCompareFields(count){
    const rows = compareFieldsList.querySelectorAll('.compare-field-row');
    if(count > rows.length){
      for(let i = rows.length; i < count; i++) compareFieldsList.appendChild(makeCompareRow(i));
    } else if(count < rows.length){
      for(let i = rows.length - 1; i >= count; i--) rows[i].remove();
    }
  }

  function refreshCompareFieldOptions(){
    compareFieldsList.querySelectorAll('.compare-field-select').forEach(sel => {
      if(single.file){
        sel.disabled = false;
        sel.innerHTML = single.file.columns.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('');
      } else {
        sel.disabled = true;
        sel.innerHTML = '<option>先上傳檔案</option>';
      }
    });
  }

  compareCountInput.addEventListener('change', () => {
    let v = parseInt(compareCountInput.value, 10);
    if(isNaN(v) || v < 1) v = 1;
    if(v > 8) v = 8;
    compareCountInput.value = v;
    syncCompareFields(v);
  });

  syncCompareFields(1); // initial single row

  // ---------- upload slot ----------
  const slot = document.getElementById('slotS');
  const input = document.getElementById('fileS');
  const body = document.getElementById('slotSBody');
  const clearBtn = document.getElementById('clearS');

  function applyActiveEntry(entry){
    single.file = { rows: entry.rows, columns: entry.columns };
    slot.classList.add('loaded');
    body.innerHTML = `
      <div class="slot-file">${escapeHtml(entry.name)}</div>
      <div class="slot-meta">${entry.rows.length} 列・${entry.columns.length} 欄</div>`;
    clearBtn.style.display = 'block';
    const colKey = document.getElementById('colKey');
    colKey.disabled = false;
    colKey.innerHTML = entry.columns.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('');
    refreshCompareFieldOptions();
    checkReady();
  }

  function detectItemModel(entry){
    const col = entry.columns.find(c => c.replace(/[\s_-]/g, '').toLowerCase() === 'itemmodel');
    if(!col) return null;
    const counts = new Map();
    entry.rows.forEach(r => {
      const v = String(r[col] ?? '').trim();
      if(!v) return;
      counts.set(v, (counts.get(v) || 0) + 1);
    });
    if(!counts.size) return null;
    let best = null, bestCount = -1;
    counts.forEach((cnt, v) => { if(cnt > bestCount){ best = v; bestCount = cnt; } });
    return best;
  }

  async function handleFiles(fileList){
    clearSingleError();
    const files = Array.from(fileList || []);
    if(!files.length) return;
    const errors = [];
    let lastEntry = null;
    for(const file of files){
      try{
        const parsed = await readWorkbook(file);
        const id = Date.now() + '-' + Math.random().toString(36).slice(2, 7);
        const entry = { id, name: file.name, rows: parsed.rows, columns: parsed.columns, uploadedAt: new Date() };
        entry.model = detectItemModel(entry);
        uploadedFiles.push(entry);
        lastEntry = entry;
      } catch(err){
        errors.push(`${file.name}：${err.message}`);
      }
    }
    if(lastEntry){
      activeFileId = lastEntry.id;
      applyActiveEntry(lastEntry);
    }
    renderFilesList();
    if(errors.length) showSingleError(errors.join('；'));
  }

  slot.addEventListener('click', () => input.click());
  slot.addEventListener('keydown', (e) => { if(e.key==='Enter'||e.key===' ') input.click(); });
  input.addEventListener('change', (e) => { handleFiles(e.target.files); });
  ['dragover','dragenter'].forEach(ev => slot.addEventListener(ev, (e)=>{ e.preventDefault(); slot.classList.add('drag'); }));
  ['dragleave','drop'].forEach(ev => slot.addEventListener(ev, (e)=>{ e.preventDefault(); slot.classList.remove('drag'); }));
  slot.addEventListener('drop', (e) => { handleFiles(e.dataTransfer.files); });

  function resetSlotToEmpty(){
    single.file = null;
    slot.classList.remove('loaded');
    body.innerHTML = `<div class="slot-main">點擊或拖曳檔案到此處（可一次選多個）</div><div class="slot-hint">支援 .xlsx / .xls / .csv</div>`;
    clearBtn.style.display = 'none';
    const colKey = document.getElementById('colKey');
    colKey.disabled = true;
    colKey.innerHTML = '<option>先上傳檔案</option>';
    compareCountInput.value = 1;
    syncCompareFields(1);
    refreshCompareFieldOptions();
    input.value = '';
    document.getElementById('results').classList.remove('show');
    checkReady();
  }

  clearBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    activeFileId = null;
    resetSlotToEmpty();
    renderFilesList();
  });

  function checkReady(){ document.getElementById('runBtnS').disabled = !single.file; }
  function showSingleError(msg){ document.getElementById('errorMsgS').textContent = msg; }
  function clearSingleError(){ document.getElementById('errorMsgS').textContent = ''; }

  // ---------- 已上傳檔案清單（歷史紀錄） ----------
  const uploadedFiles = []; // { id, name, rows, columns, uploadedAt }
  let activeFileId = null;

  function renderFilesList(){
    const list = document.getElementById('filesList');
    if(!uploadedFiles.length){
      list.innerHTML = '<div class="files-empty" id="filesEmpty">尚未上傳任何檔案</div>';
      return;
    }
    const groups = new Map(); // model label -> entries[]
    uploadedFiles.forEach(f => {
      const label = f.model || '未分類';
      if(!groups.has(label)) groups.set(label, []);
      groups.get(label).push(f);
    });
    const groupEntries = [...groups.entries()].sort((a, b) => {
      if(a[0] === '未分類') return 1;
      if(b[0] === '未分類') return -1;
      return a[0].localeCompare(b[0], 'zh-Hant');
    });

    let html = '';
    groupEntries.forEach(([label, files]) => {
      html += `<div class="file-group-label">${escapeHtml(label)}<span class="file-group-count">${files.length}</span></div>`;
      html += files.map(f => `
        <div class="file-item ${f.id===activeFileId?'active':''}" data-id="${f.id}">
          <div class="file-item-main">
            <div class="file-item-name">${escapeHtml(f.name)}</div>
            <div class="file-item-meta">${f.rows.length} 列・${f.columns.length} 欄</div>
          </div>
          <div class="file-item-actions">
            <button class="file-remove-btn" data-id="${f.id}">移除</button>
          </div>
        </div>
      `).join('');
    });
    list.innerHTML = html;
    list.querySelectorAll('.file-item').forEach(el => {
      el.addEventListener('click', () => selectFromHistory(el.dataset.id));
    });
    list.querySelectorAll('.file-remove-btn').forEach(btn => {
      btn.addEventListener('click', (e) => { e.stopPropagation(); removeFromHistory(btn.dataset.id); });
    });
  }

  function selectFromHistory(id){
    const entry = uploadedFiles.find(f => f.id === id);
    if(!entry) return;
    clearSingleError();
    activeFileId = id;
    applyActiveEntry(entry);
    renderFilesList();
  }

  function removeFromHistory(id){
    const idx = uploadedFiles.findIndex(f => f.id === id);
    if(idx === -1) return;
    uploadedFiles.splice(idx, 1);
    if(activeFileId === id){
      activeFileId = null;
      resetSlotToEmpty();
    }
    renderFilesList();
  }

  // ---------- results rendering / search / export ----------
  let resultsCtx = null;

  function openResults(){ document.getElementById('results').classList.add('show'); }

  function setGauge(countHtml, pct, statHtml){
    document.getElementById('gaugeCount').innerHTML = countHtml;
    document.getElementById('gaugeFill').style.width = pct + '%';
    document.getElementById('statRow').innerHTML = statHtml;
  }

  function paintTable(headHtml, list){
    const table = document.getElementById('resultTable');
    const emptyState = document.getElementById('emptyState');
    document.getElementById('tableHead').innerHTML = headHtml;
    if(!list.length){
      table.style.display = 'none';
      emptyState.style.display = 'block';
      document.getElementById('tableBody').innerHTML = '';
      return;
    }
    table.style.display = 'table';
    emptyState.style.display = 'none';
    resultsCtx.renderRows(list);
  }

  document.getElementById('searchBox').addEventListener('input', (e) => {
    if(!resultsCtx) return;
    const q = e.target.value.trim().toLowerCase();
    const filtered = q ? resultsCtx.dataset.filter(item => resultsCtx.matchQuery(item, q)) : resultsCtx.dataset;
    resultsCtx.renderRows(filtered);
    document.getElementById('resultTable').style.display = filtered.length ? 'table' : 'none';
    document.getElementById('emptyState').style.display = filtered.length ? 'none' : 'block';
  });

  document.getElementById('exportBtn').addEventListener('click', () => {
    if(!resultsCtx || !resultsCtx.dataset.length) return;
    const lines = [resultsCtx.exportHeader.map(h => `"${h.replace(/"/g,'""')}"`).join(',')];
    resultsCtx.dataset.forEach(item => {
      const row = resultsCtx.exportRow(item).map(v => `"${String(v ?? '').replace(/"/g,'""')}"`);
      lines.push(row.join(','));
    });
    const csv = '\uFEFF' + lines.join('\n');
    const blob = new Blob([csv], { type:'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = '重複項目.csv';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });

  // ---------- duplicate finder ----------
  document.getElementById('runBtnS').addEventListener('click', () => {
    clearSingleError();
    const keyCol = document.getElementById('colKey').value;
    const compareCols = Array.from(document.querySelectorAll('.compare-field-select')).map(s => s.value);

    if(!keyCol){ showSingleError('請先選擇 Key 欄位'); return; }
    if(!compareCols.length || compareCols.some(c => !c)){ showSingleError('請先選擇所有比對欄位'); return; }

    const ignoreCase = document.getElementById('ignoreCaseS').checked;
    const ignoreSpace = document.getElementById('ignoreSpaceS').checked;
    const normalize = (v) => {
      let s = String(v ?? '');
      if(ignoreSpace) s = s.trim();
      if(ignoreCase) s = s.toLowerCase();
      return s;
    };

    const compareMode = document.querySelector('input[name="compareMode"]:checked').value; // horizontal | vertical | both
    if((compareMode === 'horizontal' || compareMode === 'both') && compareCols.length < 2){
      showSingleError('橫排比對需要至少選擇 2 個比對欄位（用來比較同一列中欄位彼此是否相同）');
      return;
    }

    const rows = single.file.rows;
    const cols = single.file.columns;

    // 橫排比對：同一列中，選取的比對欄位彼此的值是否相同（例：12345，同一筆資料內部比對）
    function buildRowGroups(){
      const groups = [];
      for(let i = 0; i < compareCols.length; i++){
        for(let j = i + 1; j < compareCols.length; j++){
          const a = compareCols[i], b = compareCols[j];
          const matched = rows.filter(r => {
            const va = normalize(r[a]);
            const vb = normalize(r[b]);
            return va !== '' && va === vb;
          });
          if(matched.length) groups.push({ mode:'horizontal', label: `${a} = ${b}`, matchedFields:[a,b], rows: matched });
        }
      }
      return groups;
    }

    // 直排比對：同一個比對欄位裡，不同列的值是否相同（例：1／2／3／4／5，同一欄往下比、跨列）
    function buildColumnGroups(){
      const groups = [];
      compareCols.forEach(c => {
        const map = new Map();
        rows.forEach(r => {
          const v = normalize(r[c]);
          if(v === '') return;
          if(!map.has(v)) map.set(v, []);
          map.get(v).push(r);
        });
        map.forEach(arr => {
          if(arr.length > 1) groups.push({ mode:'vertical', label: `${c}（值：${arr[0][c]}）`, matchedFields:[c], rows: arr });
        });
      });
      return groups;
    }

    let allGroups = [];
    if(compareMode === 'horizontal' || compareMode === 'both') allGroups = allGroups.concat(buildRowGroups());
    if(compareMode === 'vertical' || compareMode === 'both') allGroups = allGroups.concat(buildColumnGroups());

    const flat = [];
    allGroups.forEach((g, gi) => g.rows.forEach(r => flat.push({ groupIndex: gi, mode: g.mode, label: g.label, matchedFields: g.matchedFields, row: r })));

    const distinctRows = new Set(flat.map(item => item.row));
    const distinctCount = distinctRows.size;
    const pct = rows.length ? Math.round((distinctCount/rows.length)*100) : 0;
    const modeLabel = { horizontal:'橫排比對', vertical:'直排比對', both:'橫排＋直排' }[compareMode];
    setGauge(distinctCount + ' <span>筆列有重複</span>', pct, `
      <div class="stat">總列數 <b>${rows.length}</b></div>
      <div class="stat">比對方向 <b>${modeLabel}</b></div>
      <div class="stat">重複值組數 <b>${allGroups.length}</b></div>
      <div class="stat">重複判定次數 <b>${flat.length}</b></div>
      <div class="stat">重複列比例 <b>${pct}%</b></div>`);

    let headHtml = '<th class="key">重複欄位</th>';
    cols.forEach(c => {
      const isCompare = compareCols.includes(c);
      const cls = c===keyCol ? 'keycol' : (isCompare ? 'cmp' : '');
      headHtml += `<th class="${cls}">${escapeHtml(c)}${c===keyCol?'（Key）':''}</th>`;
    });

    resultsCtx = {
      dataset: flat,
      renderRows(list){
        document.getElementById('tableBody').innerHTML = list.map(item => {
          const modeTag = item.mode === 'horizontal' ? '橫' : '直';
          let row = `<tr class="${item.groupIndex%2===1?'group-alt':''}"><td class="hitfield mode-${item.mode}">[${modeTag}] ${escapeHtml(item.label)}</td>`;
          cols.forEach(c => {
            const cls = c===keyCol ? 'keycol' : (item.matchedFields.includes(c) ? 'key' : '');
            row += `<td class="${cls}">${escapeHtml(item.row[c])}</td>`;
          });
          row += '</tr>';
          return row;
        }).join('');
      },
      matchQuery(item, q){
        const hay = [item.label, ...cols.map(c => item.row[c])].join(' ').toLowerCase();
        return hay.includes(q);
      },
      exportHeader: ['比對方向', '重複欄位', ...cols],
      exportRow(item){ return [item.mode==='horizontal'?'橫排':'直排', item.label, ...cols.map(c=>item.row[c])]; }
    };

    document.getElementById('searchBox').value = '';
    openResults();
    paintTable(headHtml, flat);
  });
</script>
</body>
</html>
