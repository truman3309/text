<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>機種出貨量統計</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme:dark;

    --ink:#F5F5F7;
    --muted:rgba(245,245,247,0.60);

    --steel:#64B5FF;
    --steel-dark:#8CC8FF;
    --steel-solid:#0A84FF;
    --steel-tint:rgba(100,181,255,0.16);
    --brass:#FFB84D;
    --brass-tint:rgba(255,159,10,0.20);
    --success:#5CE07F;
    --success-tint:rgba(48,209,88,0.20);
    --danger:#FF6B61;
    --danger-tint:rgba(255,69,58,0.20);

    --bg-a:#14171E;
    --bg-b:#191C26;
    --bg-c:#1F1B26;
    --orb-1:rgba(90,110,160,0.22);
    --orb-2:rgba(70,120,150,0.18);

    --glass:        rgba(30,30,40,0.50);
    --glass-field:  rgba(255,255,255,0.07);
    --glass-field-2:rgba(255,255,255,0.12);
    --glass-border: rgba(255,255,255,0.14);
    --glass-hi:     rgba(255,255,255,0.10);
    --glass-shadow: 0 8px 32px rgba(0,0,0,0.45);
    --hairline:     rgba(255,255,255,0.10);
    --blur:         blur(24px) saturate(160%);

    --paper:#14171E;
    --card-bg:rgba(30,30,40,0.50);
    --border:rgba(255,255,255,0.14);

    --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","PingFang TC","Noto Sans TC","Helvetica Neue",sans-serif;
    --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  }

  *{box-sizing:border-box;}
  html{ background:var(--bg-b); }
  body{
    margin:0;
    background:linear-gradient(135deg, var(--bg-a) 0%, var(--bg-b) 48%, var(--bg-c) 100%) fixed;
    color:var(--ink);
    font-family:var(--font);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    padding:32px 20px 96px;
    position:relative;
    overflow-x:hidden;
  }
  body::before, body::after{
    content:''; position:fixed; border-radius:50%; filter:blur(70px);
    pointer-events:none; z-index:0;
  }
  body::before{ width:420px; height:420px; background:var(--orb-1); top:-120px; right:-100px; }
  body::after{ width:480px; height:480px; background:var(--orb-2); bottom:-160px; left:-140px; }
  .wrap{ max-width:960px; margin:0 auto; position:relative; z-index:1; }

  /* ---------- 玻璃共用質感（只套在外層大元素）---------- */
  .panel,
  .site-nav,
  .api-status-bar{
    background:var(--glass);
    border:1px solid var(--glass-border);
    -webkit-backdrop-filter:var(--blur);
    backdrop-filter:var(--blur);
    box-shadow:var(--glass-shadow), inset 0 1px 0 var(--glass-hi);
  }

  /* ---------- 導覽列 ---------- */
  .site-nav{
    display:inline-flex; gap:2px; padding:4px; margin-bottom:36px; flex-wrap:wrap;
    border-radius:980px;
  }
  .site-nav-link{
    font-size:13px; font-weight:500; color:var(--ink); text-decoration:none;
    padding:7px 16px; border-radius:980px; border:none; margin:0;
    transition:background .2s, box-shadow .2s, color .2s;
  }
  .site-nav-link:hover{ color:var(--steel); }
  .site-nav-link.active{
    background:rgba(24,24,34,0.92); color:var(--ink);
    box-shadow:0 1px 4px rgba(0,0,0,0.4), inset 0 1px 0 var(--glass-hi);
  }

  /* ---------- 標題 ---------- */
  header{ margin-bottom:28px; }
  .eyebrow{
    font-size:13px; font-weight:600; letter-spacing:0; color:var(--steel);
    text-transform:none; display:block; margin-bottom:6px;
  }
  .eyebrow::before{ display:none; }
  h1{
    font-family:var(--font); font-weight:700; color:var(--ink);
    font-size:clamp(30px,5vw,46px); letter-spacing:-0.03em; line-height:1.08;
    margin:0 0 12px;
  }
  header p{ margin:0; color:var(--muted); font-size:15px; max-width:680px; line-height:1.7; }

  /* ---------- 狀態列 ---------- */
  .api-status-bar{
    display:inline-flex; align-items:center; gap:8px; padding:7px 14px; margin-bottom:20px;
    font-size:12.5px; color:var(--muted); border-radius:980px;
  }
  .dot{ width:8px; height:8px; border-radius:50%; background:var(--muted); flex-shrink:0; }
  .dot.ok{ background:#30D158; box-shadow:0 0 8px rgba(48,209,88,0.7); }
  .dot.bad{ background:#FF453A; box-shadow:0 0 8px rgba(255,69,58,0.7); }
  .dot.pending{ background:#FF9F0A; box-shadow:0 0 8px rgba(255,159,10,0.7); }

  /* ---------- 主卡片 ---------- */
  .panel{ border-radius:28px; overflow:hidden; }

  .summary-row{ display:flex; gap:40px; padding:24px 26px; border-bottom:1px solid var(--hairline); flex-wrap:wrap; }
  .summary-stat .label{ font-size:12.5px; font-weight:600; letter-spacing:0; text-transform:none; color:var(--muted); margin-bottom:6px; }
  .summary-stat .value{
    font-size:30px; font-weight:700; letter-spacing:-0.02em; color:var(--ink);
    font-variant-numeric:tabular-nums;
  }
  .summary-stat .value span{ font-size:14px; color:var(--muted); font-weight:500; letter-spacing:0; }

  .toolbar{ display:flex; justify-content:space-between; align-items:center; padding:16px 26px; gap:10px; flex-wrap:wrap; border-bottom:1px solid var(--hairline); }
  .search-box{
    flex:1; min-width:180px; padding:9px 16px; font-size:14px;
    font-family:var(--font); color:var(--ink);
    background:var(--glass-field); border:1px solid var(--glass-border); border-radius:980px; outline:none;
    transition:border-color .15s, box-shadow .15s, background .15s;
  }
  .search-box::placeholder{ color:var(--muted); }
  .search-box:focus{ border-color:var(--steel); box-shadow:0 0 0 4px var(--steel-tint); background:var(--glass-field-2); }

  .refresh-btn, .export-btn{
    font-family:var(--font); font-weight:500; font-size:14px;
    border:1px solid var(--glass-border); background:var(--glass-field); color:var(--steel);
    padding:9px 18px; border-radius:980px; cursor:pointer; white-space:nowrap;
    transition:background .15s, color .15s, transform .1s;
  }
  .refresh-btn:hover, .export-btn:hover{ background:var(--steel-solid); color:#fff; border-color:transparent; }
  .refresh-btn:active, .export-btn:active{ transform:scale(0.97); }

  /* ---------- 機種清單與長條 ---------- */
  .model-list{ padding:8px 0; }
  .model-row{
    display:grid; grid-template-columns:200px 1fr 100px; align-items:center; gap:16px;
    padding:13px 26px; border-bottom:1px solid var(--hairline);
    transition:background .12s;
  }
  .model-row:hover{ background:rgba(255,255,255,0.045); }
  .model-row:last-child{ border-bottom:none; }
  .model-name{ font-family:var(--mono); font-size:13.5px; font-weight:600; word-break:break-all; color:var(--ink); }
  .model-bar-track{
    height:10px; background:var(--glass-field); border:1px solid var(--glass-border);
    border-radius:980px; overflow:hidden; position:relative;
  }
  .model-bar-fill{
    height:100%; border-radius:980px;
    background:linear-gradient(90deg,#0A84FF,#64B5FF);
    box-shadow:0 0 12px rgba(100,181,255,0.45);
    transition:width .5s cubic-bezier(.2,.8,.2,1);
  }
  .model-qty{
    font-size:15px; font-weight:700; text-align:right; color:var(--brass);
    font-variant-numeric:tabular-nums; white-space:nowrap;
  }
  .model-qty span{ font-size:12px; color:var(--muted); font-weight:500; }

  /* 前三名的長條換成綠色，一眼看出主力機種 */
  .model-row:nth-child(1) .model-bar-fill,
  .model-row:nth-child(2) .model-bar-fill,
  .model-row:nth-child(3) .model-bar-fill{
    background:linear-gradient(90deg,#30D158,#66E38A);
    box-shadow:0 0 12px rgba(48,209,88,0.45);
  }

  .empty-state, .loading-state{ padding:64px 20px; text-align:center; color:var(--muted); font-size:14px; }
  .loading-state .big, .empty-state .big{ font-size:18px; font-weight:600; color:var(--ink); margin-bottom:8px; }
  .error-msg{ color:var(--danger); font-size:13.5px; padding:16px 26px; white-space:pre-line; line-height:1.6; }

  /* ---------- 捲軸 ---------- */
  ::-webkit-scrollbar{ width:10px; height:10px; }
  ::-webkit-scrollbar-thumb{
    background:rgba(235,235,245,0.26); border-radius:980px;
    border:2px solid transparent; background-clip:content-box;
  }
  ::-webkit-scrollbar-thumb:hover{ background:rgba(235,235,245,0.40); background-clip:content-box; border:2px solid transparent; }
  ::-webkit-scrollbar-track{ background:transparent; }
  ::selection{ background:rgba(100,181,255,0.40); color:#fff; }

  /* ---------- 不支援 backdrop-filter 的瀏覽器 ---------- */
  @supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
    :root{ --glass:rgba(30,31,42,0.94); }
  }

  /* ---------- 減少動態效果 ---------- */
  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; animation:none !important; }
  }

  /* ---------- 響應式 ---------- */
  @media (max-width:600px){
    body{ padding:20px 14px 64px; }
    .panel{ border-radius:22px; }
    .summary-row{ gap:24px; padding:20px 18px; }
    .toolbar{ padding:14px 18px; }
    .model-row{ grid-template-columns:1fr; gap:8px; padding:14px 18px; }
    .model-qty{ text-align:left; }
  }
</style>
</head>
<body>
<div class="wrap">

  <nav class="site-nav">
    <a class="site-nav-link" href="index.html">欄位重複比對台</a>
    <a class="site-nav-link active" href="stats-by-model.html">機種出貨量統計</a>
    <a class="site-nav-link" href="stats-by-date.html">出貨日期與出貨量統計</a>
    <a class="site-nav-link" href="search.html">資料庫搜尋</a>
  </nav>

  <header>
    <div class="eyebrow">Shipment Stats — By Model</div>
    <h1>機種出貨量統計</h1>
    <p>依 Excel E 欄（Item Model）彙整資料庫裡所有已上傳出貨資料，統計每個機種的總出貨量。資料即時從資料庫撈取，不需要另外設定。</p>
  </header>

  <div class="api-status-bar" id="apiStatusBar">
    <span class="dot" id="apiStatusDot"></span>
    <span id="apiStatusText">資料庫連線設定</span>
  </div>

  <div class="panel">
    <div class="summary-row" id="summaryRow" style="display:none;">
      <div class="summary-stat">
        <div class="label">機種數</div>
        <div class="value" id="statModelCount">0</div>
      </div>
      <div class="summary-stat">
        <div class="label">總出貨量</div>
        <div class="value" id="statTotalQty">0 <span>台</span></div>
      </div>
    </div>

    <div class="toolbar">
      <input class="search-box" id="searchBox" placeholder="搜尋機種名稱…">
      <button class="refresh-btn" id="refreshBtn">重新整理</button>
      <button class="export-btn" id="exportBtn">匯出 CSV</button>
    </div>

    <div id="content">
      <div class="loading-state" id="loadingState">
        <div class="big">正在讀取資料…</div>
        <div>資料量較大時可能需要幾秒鐘</div>
      </div>
    </div>
    <div class="error-msg" id="errorMsg" style="display:none;"></div>
  </div>

</div>

<script>
  function escapeHtml(str){
    return String(str ?? '').replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
  }

  let SUPABASE_URL = null;
  let SUPABASE_ANON_KEY = null;
  let configPromise = null;

  function ensureConfig(){
    if(SUPABASE_URL && SUPABASE_ANON_KEY) return Promise.resolve();
    if(!configPromise){
      configPromise = fetch('/api/config')
        .then(res => {
          if(!res.ok) throw new Error('無法取得資料庫連線設定（HTTP ' + res.status + '）');
          return res.json();
        })
        .then(cfg => {
          if(!cfg.supabaseUrl || !cfg.supabaseAnonKey){
            throw new Error('資料庫連線設定不完整');
          }
          SUPABASE_URL = cfg.supabaseUrl;
          SUPABASE_ANON_KEY = cfg.supabaseAnonKey;
        })
        .catch(err => { configPromise = null; throw err; });
    }
    return configPromise;
  }

  function supabaseHeaders(extra){
    return Object.assign({
      'apikey': SUPABASE_ANON_KEY,
      'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
      'Content-Type': 'application/json',
    }, extra || {});
  }

  const apiStatusDot = document.getElementById('apiStatusDot');
  const apiStatusText = document.getElementById('apiStatusText');
  function setStatusBar(state, text){
    apiStatusDot.className = 'dot' + (state ? ' ' + state : '');
    apiStatusText.textContent = text;
  }

  // 直接查已經在資料庫端算好聚合結果的 view，一次請求就拿到「機種＋數量」，不用整包資料撈回來自己算
  async function fetchModelCounts(){
    await ensureConfig();
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/model_shipment_counts?select=model,qty&order=qty.desc`,
      { headers: supabaseHeaders() }
    );
    if(!res.ok){
      const errData = await res.json().catch(() => ({}));
      throw new Error(errData.message || res.statusText);
    }
    const data = await res.json();
    return data.map(r => [r.model, r.qty]);
  }

  let fullData = []; // [[model, qty], ...]
  let maxQty = 0;

  function renderList(list){
    const content = document.getElementById('content');
    if(!list.length){
      content.innerHTML = '<div class="empty-state"><div class="big">找不到符合的機種</div></div>';
      return;
    }
    content.innerHTML = '<div class="model-list">' + list.map(([model, qty]) => {
      const pct = maxQty ? Math.round((qty / maxQty) * 100) : 0;
      return `
        <div class="model-row">
          <div class="model-name">${escapeHtml(model)}</div>
          <div class="model-bar-track"><div class="model-bar-fill" style="width:${pct}%"></div></div>
          <div class="model-qty">${qty} <span>台</span></div>
        </div>`;
    }).join('') + '</div>';
  }

  function updateSummary(list, totalQty){
    document.getElementById('summaryRow').style.display = 'flex';
    document.getElementById('statModelCount').textContent = list.length;
    document.getElementById('statTotalQty').innerHTML = totalQty.toLocaleString() + ' <span>台</span>';
  }

  async function loadData(){
    const errorMsg = document.getElementById('errorMsg');
    const content = document.getElementById('content');
    errorMsg.style.display = 'none';
    document.getElementById('summaryRow').style.display = 'none';
    content.innerHTML = '<div class="loading-state"><div class="big">正在讀取資料…</div><div>資料量較大時可能需要幾秒鐘</div></div>';
    setStatusBar('pending', '資料庫連線：讀取中…');

    try{
      fullData = await fetchModelCounts();
      setStatusBar('ok', '資料庫連線成功');
      maxQty = fullData.length ? fullData[0][1] : 0;
      const totalQty = fullData.reduce((sum, [, qty]) => sum + qty, 0);
      updateSummary(fullData, totalQty);
      renderList(fullData);
    } catch(err){
      setStatusBar('bad', '資料庫連線失敗：' + err.message);
      content.innerHTML = '';
      errorMsg.style.display = 'block';
      errorMsg.textContent = '讀取失敗：' + err.message;
    }
  }

  let searchDebounceTimer = null;
  document.getElementById('searchBox').addEventListener('input', (e) => {
    clearTimeout(searchDebounceTimer);
    const q = e.target.value.trim().toLowerCase();
    searchDebounceTimer = setTimeout(() => {
      const filtered = q ? fullData.filter(([model]) => model.toLowerCase().includes(q)) : fullData;
      renderList(filtered);
    }, 150);
  });

  document.getElementById('refreshBtn').addEventListener('click', loadData);

  document.getElementById('exportBtn').addEventListener('click', () => {
    if(!fullData.length) return;
    const lines = ['"機種","出貨量"'];
    fullData.forEach(([model, qty]) => {
      lines.push(`"${String(model).replace(/"/g, '""')}","${qty}"`);
    });
    const csv = '\uFEFF' + lines.join('\n');
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = '機種出貨量統計.csv';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });

  loadData();
</script>
</body>
</html>
