<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>資料庫搜尋</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme:dark;

    --ink:#F5F5F7;
    --muted:rgba(245,245,247,0.60);

    --steel:#64B5FF;
    --steel-dark:#8CC8FF;
    --steel-solid:#0A84FF;
    --steel-tint:rgba(100,181,255,0.16);
    --brass:#FFB84D;
    --brass-tint:rgba(255,159,10,0.20);
    --success:#5CE07F;
    --success-tint:rgba(48,209,88,0.20);
    --danger:#FF6B61;
    --danger-tint:rgba(255,69,58,0.20);

    --bg-a:#14171E;
    --bg-b:#191C26;
    --bg-c:#1F1B26;
    --orb-1:rgba(90,110,160,0.22);
    --orb-2:rgba(70,120,150,0.18);

    --glass:        rgba(30,30,40,0.50);
    --glass-field:  rgba(255,255,255,0.07);
    --glass-field-2:rgba(255,255,255,0.12);
    --glass-border: rgba(255,255,255,0.14);
    --glass-hi:     rgba(255,255,255,0.10);
    --glass-shadow: 0 8px 32px rgba(0,0,0,0.45);
    --hairline:     rgba(255,255,255,0.10);
    --blur:         blur(24px) saturate(160%);

    --paper:#14171E;
    --card-bg:rgba(30,30,40,0.50);
    --border:rgba(255,255,255,0.14);

    --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","PingFang TC","Noto Sans TC","Helvetica Neue",sans-serif;
    --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  }

  *{box-sizing:border-box;}
  html{ background:var(--bg-b); }
  body{
    margin:0;
    background:linear-gradient(135deg, var(--bg-a) 0%, var(--bg-b) 48%, var(--bg-c) 100%) fixed;
    color:var(--ink);
    font-family:var(--font);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    padding:32px 20px 96px;
    position:relative;
    overflow-x:hidden;
  }
  body::before, body::after{
    content:''; position:fixed; border-radius:50%; filter:blur(70px);
    pointer-events:none; z-index:0;
  }
  body::before{ width:420px; height:420px; background:var(--orb-1); top:-120px; right:-100px; }
  body::after{ width:480px; height:480px; background:var(--orb-2); bottom:-160px; left:-140px; }
  .wrap{ max-width:1080px; margin:0 auto; position:relative; z-index:1; }

  /* ---------- 玻璃共用質感（只套在外層大元素）---------- */
  .panel,
  .site-nav,
  .api-status-bar{
    background:var(--glass);
    border:1px solid var(--glass-border);
    -webkit-backdrop-filter:var(--blur);
    backdrop-filter:var(--blur);
    box-shadow:var(--glass-shadow), inset 0 1px 0 var(--glass-hi);
  }

  /* ---------- 導覽列 ---------- */
  .site-nav{
    display:inline-flex; gap:2px; padding:4px; margin-bottom:36px; flex-wrap:wrap;
    border-radius:980px;
  }
  .site-nav-link{
    font-size:13px; font-weight:500; color:var(--ink); text-decoration:none;
    padding:7px 16px; border-radius:980px; border:none; margin:0;
    transition:background .2s, box-shadow .2s, color .2s;
  }
  .site-nav-link:hover{ color:var(--steel); }
  .site-nav-link.active{
    background:rgba(24,24,34,0.92); color:var(--ink);
    box-shadow:0 1px 4px rgba(0,0,0,0.4), inset 0 1px 0 var(--glass-hi);
  }

  /* ---------- 標題 ---------- */
  header{ margin-bottom:28px; }
  .eyebrow{
    font-size:13px; font-weight:600; letter-spacing:0; color:var(--steel);
    text-transform:none; display:block; margin-bottom:6px;
  }
  .eyebrow::before{ display:none; }
  h1{
    font-family:var(--font); font-weight:700; color:var(--ink);
    font-size:clamp(30px,5vw,46px); letter-spacing:-0.03em; line-height:1.08;
    margin:0 0 12px;
  }
  header p{ margin:0; color:var(--muted); font-size:15px; max-width:700px; line-height:1.7; }

  /* ---------- 狀態列 ---------- */
  .api-status-bar{
    display:inline-flex; align-items:center; gap:8px; padding:7px 14px; margin-bottom:20px;
    font-size:12.5px; color:var(--muted); border-radius:980px;
  }
  .dot{ width:8px; height:8px; border-radius:50%; background:var(--muted); flex-shrink:0; }
  .dot.ok{ background:#30D158; box-shadow:0 0 8px rgba(48,209,88,0.7); }
  .dot.bad{ background:#FF453A; box-shadow:0 0 8px rgba(255,69,58,0.7); }
  .dot.pending{ background:#FF9F0A; box-shadow:0 0 8px rgba(255,159,10,0.7); }

  /* ---------- 卡片 ---------- */
  .panel{ border-radius:28px; overflow:hidden; margin-bottom:22px; }

  .search-panel{ padding:26px; }
  .search-row{ display:flex; gap:10px; }
  .search-input{
    flex:1; padding:13px 20px; font-size:15px;
    font-family:var(--mono); color:var(--ink);
    background:var(--glass-field); border:1px solid var(--glass-border); border-radius:980px; outline:none;
    transition:border-color .15s, box-shadow .15s, background .15s;
  }
  .search-input::placeholder{ color:var(--muted); font-family:var(--font); }
  .search-input:focus{ border-color:var(--steel); box-shadow:0 0 0 4px var(--steel-tint); background:var(--glass-field-2); }

  .search-btn, .advanced-search-btn{
    font-family:var(--font); font-weight:500; font-size:15px; letter-spacing:0;
    background:var(--steel-solid); color:#fff; border:none; padding:0 28px; border-radius:980px;
    cursor:pointer; white-space:nowrap;
    box-shadow:0 6px 20px rgba(10,132,255,0.35), inset 0 1px 0 rgba(255,255,255,0.3);
    transition:background .15s, transform .1s;
  }
  .advanced-search-btn{ padding:11px 26px; margin-top:16px; }
  .search-btn:hover:not(:disabled), .advanced-search-btn:hover:not(:disabled){ background:#3C9BFF; }
  .search-btn:active:not(:disabled), .advanced-search-btn:active:not(:disabled){ transform:scale(0.97); }
  .search-btn:disabled, .advanced-search-btn:disabled{
    background:var(--glass-field); color:rgba(245,245,247,0.30); cursor:not-allowed;
    box-shadow:none; border:1px solid var(--glass-border);
  }
  .search-hint{ font-size:12.5px; color:var(--muted); margin-top:12px; line-height:1.7; }

  /* ---------- 進階搜尋 ---------- */
  .advanced-toggle{
    font-family:var(--font); font-size:13.5px; font-weight:500; letter-spacing:0;
    color:var(--steel); background:none; border:none; cursor:pointer; padding:0; margin-top:16px;
    display:flex; align-items:center; gap:6px;
  }
  .advanced-toggle:hover{ color:var(--steel-dark); }
  .advanced-panel{
    margin-top:18px; padding:18px; display:none;
    background:var(--glass-field); border:1px solid var(--glass-border); border-radius:20px;
  }
  .advanced-panel.show{ display:block; }
  .condition-row{ display:flex; gap:8px; margin-bottom:10px; align-items:center; }
  .condition-and-label{
    font-size:11.5px; font-weight:600; letter-spacing:0; text-transform:none;
    color:var(--brass); width:38px; flex-shrink:0; text-align:center;
  }
  .condition-field, .condition-value{
    padding:10px 12px; font-size:14px; color:var(--ink);
    background:var(--glass-field); border:1px solid var(--glass-border); border-radius:12px; outline:none;
    transition:border-color .15s, box-shadow .15s, background .15s;
  }
  .condition-field{ flex:0 0 200px; font-family:var(--font); }
  .condition-value{ flex:1; font-family:var(--mono); min-width:0; }
  .condition-value::placeholder{ color:var(--muted); font-family:var(--font); }
  .condition-field:focus, .condition-value:focus{
    border-color:var(--steel); box-shadow:0 0 0 4px var(--steel-tint); background:var(--glass-field-2);
  }
  .condition-field option{ color:#F5F5F7; background:#1E2029; }
  .condition-remove-btn{
    font-family:var(--font); font-size:13px; border:none; background:var(--glass-field-2);
    border-radius:50%; width:30px; height:30px; cursor:pointer; color:var(--muted); flex-shrink:0;
    transition:background .15s, color .15s;
  }
  .condition-remove-btn:hover{ background:var(--danger-tint); color:var(--danger); }
  .add-condition-btn{
    font-family:var(--font); font-size:13px; font-weight:500; border:1px dashed rgba(255,255,255,0.28);
    background:transparent; border-radius:980px; padding:8px 16px; cursor:pointer; color:var(--steel); margin-top:2px;
    transition:background .15s, border-color .15s;
  }
  .add-condition-btn:hover{ background:var(--steel-tint); border-color:var(--steel); }

  /* ---------- 結果區 ---------- */
  .section-title{
    font-size:13px; letter-spacing:0; text-transform:none;
    color:var(--steel); font-weight:600; padding:20px 26px 6px; display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  }
  .section-count{
    font-weight:600; color:var(--ink); background:var(--steel-tint); border-radius:980px;
    padding:2px 10px; font-size:12px; font-variant-numeric:tabular-nums;
  }

  .table-scroll{
    overflow-x:auto; margin-top:10px;
    border-top:1px solid var(--hairline); background:rgba(10,11,18,0.38);
  }
  table{ border-collapse:collapse; width:100%; font-size:13.5px; }
  thead th{
    position:sticky; top:0; background:rgba(30,32,44,0.94);
    text-align:left; padding:11px 16px; font-size:12px; font-weight:600;
    letter-spacing:0; text-transform:none; color:var(--muted);
    border-bottom:1px solid var(--hairline); white-space:nowrap;
  }
  tbody td{ padding:11px 16px; border-bottom:1px solid var(--hairline); white-space:nowrap; }
  tbody tr{ transition:background .12s; }
  tbody tr:hover{ background:var(--steel-tint); }
  tbody tr:last-child td{ border-bottom:none; }
  td.mono{ font-family:var(--mono); font-variant-numeric:tabular-nums; }
  td.matchfield{ font-weight:600; color:var(--brass); background:var(--brass-tint); }
  td.filename{ font-family:var(--mono); font-size:12px; color:var(--steel); white-space:normal; word-break:break-all; max-width:280px; }

  .empty-state, .loading-state, .idle-state{ padding:64px 20px; text-align:center; color:var(--muted); font-size:14px; }
  .loading-state .big, .empty-state .big, .idle-state .big{ font-size:18px; font-weight:600; color:var(--ink); margin-bottom:8px; }
  .error-msg{ color:var(--danger); font-size:13.5px; padding:16px 26px; white-space:pre-line; line-height:1.6; }

  /* ---------- 捲軸 ---------- */
  ::-webkit-scrollbar{ width:10px; height:10px; }
  ::-webkit-scrollbar-thumb{
    background:rgba(235,235,245,0.26); border-radius:980px;
    border:2px solid transparent; background-clip:content-box;
  }
  ::-webkit-scrollbar-thumb:hover{ background:rgba(235,235,245,0.40); background-clip:content-box; border:2px solid transparent; }
  ::-webkit-scrollbar-track{ background:transparent; }
  ::selection{ background:rgba(100,181,255,0.40); color:#fff; }

  /* ---------- 不支援 backdrop-filter 的瀏覽器 ---------- */
  @supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
    :root{ --glass:rgba(30,31,42,0.94); }
  }

  /* ---------- 減少動態效果 ---------- */
  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; animation:none !important; }
  }

  /* ---------- 響應式 ---------- */
  @media (max-width:640px){
    body{ padding:20px 14px 64px; }
    .panel{ border-radius:22px; }
    .search-panel{ padding:18px; }
    .search-row{ flex-direction:column; }
    .search-btn{ padding:12px 28px; }
    .condition-row{ flex-wrap:wrap; }
    .condition-and-label{ width:100%; text-align:left; }
    .condition-field{ flex:1 1 100%; }
    .section-title{ padding-left:18px; padding-right:18px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <nav class="site-nav">
    <a class="site-nav-link" href="index.html">欄位重複比對台</a>
    <a class="site-nav-link" href="stats-by-model.html">機種出貨量統計</a>
    <a class="site-nav-link" href="stats-by-date.html">出貨日期與出貨量統計</a>
    <a class="site-nav-link active" href="search.html">資料庫搜尋</a>
  </nav>

  <header>
    <div class="eyebrow">Database Search</div>
    <h1>資料庫搜尋</h1>
    <p>輸入任何內容（機種、IMEI1、Serial No.、MAC ID、Battery SN、PCBA SN、LCD SN、ICCID、PCB Main Board SN、SIM Unlock Code、PO No.、Reference ID），直接查詢資料庫。</p>
  </header>

  <div class="api-status-bar" id="apiStatusBar">
    <span class="dot" id="apiStatusDot"></span>
    <span id="apiStatusText">資料庫連線設定</span>
  </div>

  <div class="panel">
    <div class="search-panel">
      <div class="search-row">
        <input type="text" class="search-input" id="searchInput" placeholder="輸入機種、或任一唯一碼…" autocomplete="off">
        <button class="search-btn" id="searchBtn">▶ 搜尋</button>
      </div>
      <div class="search-hint">按 Enter 或點搜尋按鈕開始查詢；輸入內容需至少 2 個字元，會同時查機種與各個唯一碼欄位。</div>

      <button class="advanced-toggle" id="advancedToggle">▸ 進階搜尋（多項條件）</button>
      <div class="advanced-panel" id="advancedPanel">
        <div id="conditionsList"></div>
        <button class="add-condition-btn" id="addConditionBtn">+ 新增條件</button>
        <div>
          <button class="advanced-search-btn" id="advancedSearchBtn">▶ 進階搜尋</button>
        </div>
        <div class="search-hint">多個條件會用「且（AND）」的方式組合，需要全部條件都符合才會出現在結果中。此模式只查裝置資料（不含檔名）。</div>
      </div>
    </div>
    <div class="error-msg" id="errorMsg" style="display:none;"></div>
  </div>

  <div class="panel" id="resultsPanel" style="display:none;">
    <div id="content"></div>
  </div>

</div>

<script>
  function escapeHtml(str){
    return String(str ?? '').replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
  }

  let SUPABASE_URL = null;
  let SUPABASE_ANON_KEY = null;
  let configPromise = null;

  function ensureConfig(){
    if(SUPABASE_URL && SUPABASE_ANON_KEY) return Promise.resolve();
    if(!configPromise){
      configPromise = fetch('/api/config')
        .then(res => {
          if(!res.ok) throw new Error('無法取得資料庫連線設定（HTTP ' + res.status + '）');
          return res.json();
        })
        .then(cfg => {
          if(!cfg.supabaseUrl || !cfg.supabaseAnonKey){
            throw new Error('資料庫連線設定不完整');
          }
          SUPABASE_URL = cfg.supabaseUrl;
          SUPABASE_ANON_KEY = cfg.supabaseAnonKey;
        })
        .catch(err => { configPromise = null; throw err; });
    }
    return configPromise;
  }

  function supabaseHeaders(extra){
    return Object.assign({
      'apikey': SUPABASE_ANON_KEY,
      'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
      'Content-Type': 'application/json',
    }, extra || {});
  }

  const apiStatusDot = document.getElementById('apiStatusDot');
  const apiStatusText = document.getElementById('apiStatusText');
  function setStatusBar(state, text){
    apiStatusDot.className = 'dot' + (state ? ' ' + state : '');
    apiStatusText.textContent = text;
  }

  async function testConnection(){
    setStatusBar('pending', '資料庫連線：測試中…');
    try{
      await ensureConfig();
      const res = await fetch(SUPABASE_URL + '/rest/v1/shipment_files?select=id&limit=1', { headers: supabaseHeaders() });
      if(res.ok){ setStatusBar('ok', '資料庫連線成功'); return true; }
      const errData = await res.json().catch(() => ({}));
      throw new Error(errData.message || res.statusText);
    } catch(err){
      setStatusBar('bad', '資料庫連線失敗：' + err.message);
      return false;
    }
  }

  // 常見會用來查詢的欄位（9 個唯一碼 + 機種 + PO/Reference），逐一查詢才能清楚標示是哪個欄位命中
  const SEARCH_FIELDS = [
    ['imei1', 'IMEI1'], ['serial_no', 'Serial No.'], ['mac_id', 'MAC ID'], ['battery_sn', 'Battery SN'],
    ['pcba_sn', 'PCBA SN'], ['lcd_sn', 'LCD SN'], ['iccid', 'ICCID'],
    ['pcb_main_board_sn', 'PCB Main Board SN'], ['sim_unlock_code', 'SIM Unlock Code'],
    ['item_model', 'Item Model'], ['po_no', 'PO No.'], ['reference_id', 'Reference ID'],
  ];
  const RESULT_LIMIT_PER_FIELD = 50;

  async function searchRecordsByField(query, dbField){
    await ensureConfig();
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/shipment_records?select=id,file_id,row_index,${dbField},item_model,shipment_files(source_file_name,sheet_name,uploaded_at)&${dbField}=ilike.*${encodeURIComponent(query)}*&limit=${RESULT_LIMIT_PER_FIELD}`,
      { headers: supabaseHeaders() }
    );
    if(!res.ok){
      const errData = await res.json().catch(() => ({}));
      throw new Error(errData.message || res.statusText);
    }
    return await res.json();
  }

  function renderResults(query, recordResults){
    const panel = document.getElementById('resultsPanel');
    const content = document.getElementById('content');
    panel.style.display = 'block';

    let html = '';

    // ---- 符合的裝置資料（依欄位分組） ----
    const totalRecordMatches = recordResults.reduce((s, r) => s + r.rows.length, 0);
    html += `<div class="section-title">符合的裝置資料<span class="section-count">${totalRecordMatches}</span></div>`;
    const nonEmpty = recordResults.filter(r => r.rows.length);
    if(nonEmpty.length){
      html += `
        <div class="table-scroll">
          <table>
            <thead><tr><th>命中欄位</th><th>值</th><th>機種</th><th>來源檔案</th><th>分頁</th><th>列</th></tr></thead>
            <tbody>${nonEmpty.flatMap(r => r.rows.map(row => `
              <tr>
                <td class="matchfield">${escapeHtml(r.label)}</td>
                <td class="mono">${escapeHtml(row[r.field] ?? '')}</td>
                <td>${escapeHtml(row.item_model || '—')}</td>
                <td class="filename">${escapeHtml(row.shipment_files ? row.shipment_files.source_file_name : '—')}</td>
                <td class="mono">${escapeHtml(row.shipment_files ? row.shipment_files.sheet_name : '—')}</td>
                <td class="mono">${row.row_index + 2}</td>
              </tr>
            `)).join('')}</tbody>
          </table>
        </div>`;
    } else {
      html += '<div class="empty-state" style="padding:24px;">沒有裝置資料符合這個查詢</div>';
    }

    content.innerHTML = html;
  }

  async function runSearch(){
    const input = document.getElementById('searchInput');
    const btn = document.getElementById('searchBtn');
    const errorMsg = document.getElementById('errorMsg');
    const query = input.value.trim();

    errorMsg.style.display = 'none';
    if(query.length < 2){
      errorMsg.style.display = 'block';
      errorMsg.textContent = '請輸入至少 2 個字元再搜尋';
      return;
    }

    btn.disabled = true;
    btn.textContent = '搜尋中…';
    document.getElementById('resultsPanel').style.display = 'block';
    document.getElementById('content').innerHTML = '<div class="loading-state"><div class="big">正在查詢資料庫…</div></div>';

    try{
      const fieldResults = await Promise.all(
        SEARCH_FIELDS.map(async ([dbField, label]) => ({
          field: dbField, label, rows: await searchRecordsByField(query, dbField),
        }))
      );
      renderResults(query, fieldResults);
    } catch(err){
      document.getElementById('content').innerHTML = '';
      errorMsg.style.display = 'block';
      errorMsg.textContent = '查詢失敗：' + err.message;
    } finally {
      btn.disabled = false;
      btn.textContent = '▶ 搜尋';
    }
  }

  document.getElementById('searchBtn').addEventListener('click', runSearch);
  document.getElementById('searchInput').addEventListener('keydown', (e) => {
    if(e.key === 'Enter') runSearch();
  });

  // ================= 進階搜尋（多項條件，AND 組合）=================
  const conditionsList = document.getElementById('conditionsList');
  let conditionRowCount = 0;

  function makeConditionRow(){
    conditionRowCount++;
    const row = document.createElement('div');
    row.className = 'condition-row';
    row.innerHTML = `
      <span class="condition-and-label">${conditionRowCount === 1 ? '搜尋' : 'AND'}</span>
      <select class="condition-field">
        ${SEARCH_FIELDS.map(([field, label]) => `<option value="${field}">${escapeHtml(label)}</option>`).join('')}
      </select>
      <input type="text" class="condition-value" placeholder="輸入值…">
      <button class="condition-remove-btn" title="移除這個條件">✕</button>
    `;
    row.querySelector('.condition-remove-btn').addEventListener('click', () => {
      row.remove();
      relabelConditionRows();
    });
    row.querySelector('.condition-value').addEventListener('keydown', (e) => {
      if(e.key === 'Enter') runAdvancedSearch();
    });
    return row;
  }

  function relabelConditionRows(){
    conditionsList.querySelectorAll('.condition-row').forEach((row, i) => {
      row.querySelector('.condition-and-label').textContent = i === 0 ? '搜尋' : 'AND';
    });
  }

  document.getElementById('addConditionBtn').addEventListener('click', () => {
    conditionsList.appendChild(makeConditionRow());
  });

  // 預設先放一行條件
  conditionsList.appendChild(makeConditionRow());

  document.getElementById('advancedToggle').addEventListener('click', () => {
    const panel = document.getElementById('advancedPanel');
    const btn = document.getElementById('advancedToggle');
    const showing = panel.classList.toggle('show');
    btn.textContent = showing ? '▾ 進階搜尋（多項條件）' : '▸ 進階搜尋（多項條件）';
  });

  async function searchRecordsByConditions(conditions){
    await ensureConfig();
    const params = conditions
      .map(([field, value]) => `${field}=ilike.*${encodeURIComponent(value)}*`)
      .join('&');
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/shipment_records?select=*,shipment_files(source_file_name,sheet_name,uploaded_at)&${params}&limit=200`,
      { headers: supabaseHeaders() }
    );
    if(!res.ok){
      const errData = await res.json().catch(() => ({}));
      throw new Error(errData.message || res.statusText);
    }
    return await res.json();
  }

  function renderAdvancedResults(conditions, rows){
    const panel = document.getElementById('resultsPanel');
    const content = document.getElementById('content');
    panel.style.display = 'block';

    const condDesc = conditions.map(([field, value]) => {
      const label = (SEARCH_FIELDS.find(f => f[0] === field) || [, field])[1];
      return `${label} 包含「${value}」`;
    }).join('　且　');

    let html = `<div class="section-title">符合條件的裝置資料（${condDesc}）<span class="section-count">${rows.length}</span></div>`;
    if(rows.length){
      html += `
        <div class="table-scroll">
          <table>
            <thead><tr><th>機種</th>${conditions.map(([field]) => `<th>${escapeHtml((SEARCH_FIELDS.find(f => f[0] === field) || [,field])[1])}</th>`).join('')}<th>來源檔案</th><th>分頁</th><th>列</th></tr></thead>
            <tbody>${rows.map(row => `
              <tr>
                <td>${escapeHtml(row.item_model || '—')}</td>
                ${conditions.map(([field]) => `<td class="mono">${escapeHtml(row[field] ?? '')}</td>`).join('')}
                <td class="filename">${escapeHtml(row.shipment_files ? row.shipment_files.source_file_name : '—')}</td>
                <td class="mono">${escapeHtml(row.shipment_files ? row.shipment_files.sheet_name : '—')}</td>
                <td class="mono">${row.row_index + 2}</td>
              </tr>
            `).join('')}</tbody>
          </table>
        </div>`;
    } else {
      html += '<div class="empty-state" style="padding:24px;">沒有符合全部條件的資料</div>';
    }
    content.innerHTML = html;
  }

  async function runAdvancedSearch(){
    const errorMsg = document.getElementById('errorMsg');
    const btn = document.getElementById('advancedSearchBtn');
    errorMsg.style.display = 'none';

    const conditions = [...conditionsList.querySelectorAll('.condition-row')]
      .map(row => [row.querySelector('.condition-field').value, row.querySelector('.condition-value').value.trim()])
      .filter(([, value]) => value.length >= 1);

    if(!conditions.length){
      errorMsg.style.display = 'block';
      errorMsg.textContent = '請至少填寫一個條件的值';
      return;
    }

    btn.disabled = true;
    btn.textContent = '搜尋中…';
    document.getElementById('resultsPanel').style.display = 'block';
    document.getElementById('content').innerHTML = '<div class="loading-state"><div class="big">正在查詢資料庫…</div></div>';

    try{
      const rows = await searchRecordsByConditions(conditions);
      renderAdvancedResults(conditions, rows);
    } catch(err){
      document.getElementById('content').innerHTML = '';
      errorMsg.style.display = 'block';
      errorMsg.textContent = '查詢失敗：' + err.message;
    } finally {
      btn.disabled = false;
      btn.textContent = '▶ 進階搜尋';
    }
  }

  document.getElementById('advancedSearchBtn').addEventListener('click', runAdvancedSearch);

  testConnection();
</script>
</body>
</html>
