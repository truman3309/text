<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>機種出貨量統計</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../stats-by-model/stats-by-model.css">
</head>
<body>
<div class="wrap">

  <nav class="site-nav">
    <a class="site-nav-link" href="../Field Comparison/Field Comparison.html">欄位重複比對台</a>
    <a class="site-nav-link active" href="../stats-by-model/stats-by-model.html">機種出貨量統計</a>
    <a class="site-nav-link" href="../stats-by-date/stats-by-date.html">出貨日期與出貨量統計</a>
  </nav>

  <header>
    <div class="eyebrow">Shipment Stats — By Model</div>
    <h1>機種出貨量統計</h1>
    <p>依 Excel E 欄（Item Model）彙整資料庫裡所有已上傳出貨資料，統計每個機種的總出貨量。資料即時從資料庫撈取，不需要另外設定。</p>
  </header>

  <div class="api-status-bar" id="apiStatusBar">
    <span class="dot" id="apiStatusDot"></span>
    <span id="apiStatusText">資料庫連線設定</span>
  </div>

  <div class="panel">
    <div class="summary-row" id="summaryRow" style="display:none;">
      <div class="summary-stat">
        <div class="label">機種數</div>
        <div class="value" id="statModelCount">0</div>
      </div>
      <div class="summary-stat">
        <div class="label">總出貨量</div>
        <div class="value" id="statTotalQty">0 <span>台</span></div>
      </div>
    </div>

    <div class="toolbar">
      <input class="search-box" id="searchBox" placeholder="搜尋機種名稱…">
      <button class="refresh-btn" id="refreshBtn">重新整理</button>
      <button class="export-btn" id="exportBtn">匯出 CSV</button>
    </div>

    <div id="content">
      <div class="loading-state" id="loadingState">
        <div class="big">正在讀取資料…</div>
        <div>資料量較大時可能需要幾秒鐘</div>
      </div>
    </div>
    <div class="error-msg" id="errorMsg" style="display:none;"></div>
  </div>

</div>

<script src="../stats-by-model/stats-by-model.js"></script>
</body>
</html>
